name: Build APK

# Builds a real, installable debug APK on GitHub's own servers.
# Push this project to a GitHub repo, then check the "Actions" tab —
# the finished .apk shows up there as a downloadable artifact in a few minutes.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CameraProfessional-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
